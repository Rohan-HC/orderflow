services:

  postgres:
    image: postgres:18
    container_name: orderflow-postgres

    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow_dev

    ports:
      - "5432:5432"

    volumes:
      - orderflow_postgres_data:/var/lib/postgresql

volumes:
  orderflow_postgres_data: