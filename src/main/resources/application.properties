spring.application.name=order-flow

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderflow}
spring.datasource.username=${DB_USERNAME:orderflow}
spring.datasource.password=${DB_PASSWORD:orderflow_dev}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=orderflow-order-created-consumer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.auto-offset-reset=latest

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info,prometheus,metrics

management.endpoint.health.show-details=always

management.info.env.enabled=true

info.app.name=OrderFlow
info.app.description=Event-driven order and inventory platform
info.app.version=1.0.0

management.tracing.sampling.probability=1.0

management.opentelemetry.resource-attributes.service.name=orderflow
management.opentelemetry.resource-attributes.service.version=1.0.0

management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

management.endpoint.health.probes.enabled=true